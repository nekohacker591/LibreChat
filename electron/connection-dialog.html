<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibreChat Connection Setup</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #171717;
      color: #ececec;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #212121;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 32px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .header img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
    }
    .header h1 {
      font-size: 1.4rem;
      font-weight: 600;
    }
    .header p {
      font-size: 0.88rem;
      color: #999;
      margin-top: 4px;
    }
    .banner-error {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-bottom: 20px;
      display: none;
    }
    .field {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #aaa;
      margin-bottom: 8px;
    }
    input[type="text"] {
      width: 100%;
      background: #171717;
      border: 1px solid #444;
      color: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #10b981;
    }
    .presets {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .chip {
      background: #2a2a2a;
      border: 1px solid #3d3d3d;
      color: #bbb;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .chip:hover {
      background: #383838;
      color: #fff;
    }
    .status-area {
      min-height: 24px;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }
    .status-area.success {
      color: #10b981;
    }
    .status-area.fail {
      color: #ef4444;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    button {
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s, background-color 0.2s;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #2e2e2e;
      color: #ddd;
      border: 1px solid #444;
    }
    .btn-secondary:hover:not(:disabled) {
      background: #3a3a3a;
    }
    .btn-primary {
      background: #10b981;
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      background: #059669;
    }
    .helper {
      font-size: 0.78rem;
      color: #777;
      margin-top: 20px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <img src="assets/icon.png" alt="LibreChat Logo">
      <div>
        <h1>LibreChat Desktop</h1>
        <p>Server Connection Configuration</p>
      </div>
    </div>

    <div id="errorBanner" class="banner-error"></div>

    <div class="field">
      <label for="serverUrl">LibreChat Server Address</label>
      <input type="text" id="serverUrl" placeholder="http://localhost:3080">
      <div class="presets">
        <span class="chip" onclick="setPreset('http://localhost:3080')">Localhost:3080</span>
        <span class="chip" onclick="setPreset('http://127.0.0.1:3080')">127.0.0.1:3080</span>
      </div>
    </div>

    <div id="statusArea" class="status-area"></div>

    <div class="actions">
      <button id="btnTest" class="btn-secondary" onclick="testConnection()">Test Connection</button>
      <button id="btnSave" class="btn-primary" onclick="saveAndConnect()">Save & Connect</button>
    </div>

    <p class="helper">
      Tip: If running LibreChat locally on your PC, ensure MongoDB and the backend server are running (`npm run backend`). You can also connect to any remote self-hosted LibreChat deployment.
    </p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const failedUrl = params.get('failedUrl');
    const errorMsg = params.get('error');

    const urlInput = document.getElementById('serverUrl');
    const errorBanner = document.getElementById('errorBanner');
    const statusArea = document.getElementById('statusArea');
    const btnTest = document.getElementById('btnTest');
    const btnSave = document.getElementById('btnSave');

    if (errorMsg) {
      errorBanner.style.display = 'block';
      errorBanner.textContent = `Could not connect to ${failedUrl || 'server'}: ${errorMsg}`;
    }

    // Load initial config
    if (window.electronAPI) {
      window.electronAPI.getConfig().then((cfg) => {
        if (cfg && cfg.serverUrl) {
          urlInput.value = cfg.serverUrl;
        } else {
          urlInput.value = 'http://localhost:3080';
        }
      });
    } else {
      urlInput.value = 'http://localhost:3080';
    }

    function setPreset(val) {
      urlInput.value = val;
    }

    async function testConnection() {
      const url = urlInput.value.trim();
      if (!url) return;

      statusArea.className = 'status-area';
      statusArea.textContent = 'Testing connection...';
      btnTest.disabled = true;

      try {
        const res = await window.electronAPI.testConnection(url);
        if (res.success) {
          statusArea.className = 'status-area success';
          statusArea.textContent = '✓ Successfully connected to LibreChat server!';
        } else {
          statusArea.className = 'status-area fail';
          statusArea.textContent = `✗ Connection failed: ${res.error || 'Server returned status ' + res.statusCode}`;
        }
      } catch (err) {
        statusArea.className = 'status-area fail';
        statusArea.textContent = `✗ Error: ${err.message}`;
      } finally {
        btnTest.disabled = false;
      }
    }

    async function saveAndConnect() {
      const url = urlInput.value.trim();
      if (!url) return;

      btnSave.disabled = true;
      statusArea.className = 'status-area';
      statusArea.textContent = 'Connecting...';

      try {
        await window.electronAPI.saveServerUrl(url);
      } catch (err) {
        statusArea.className = 'status-area fail';
        statusArea.textContent = `✗ Failed to save: ${err.message}`;
        btnSave.disabled = false;
      }
    }

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        saveAndConnect();
      }
    });
  </script>
</body>
</html>
