plugins {
    id 'com.android.application'
}

/**
 * Signing credentials stay out of the repository. They are read from
 * android/local.properties (untracked) or from the LIBRECHAT_STORE_PASSWORD /
 * LIBRECHAT_KEY_PASSWORD environment variables used by CI. Keep
 * android/app/my-release-key.jks in sync with the values you provide.
 */
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def requireSigningSecret = { value, propertyName, envName ->
    if (value == null || value.trim().isEmpty()) {
        throw new GradleException(
            "Missing signing secret '${propertyName}'. Add it to android/local.properties " +
            "or set the ${envName} environment variable."
        )
    }
    return value
}

def signingStorePassword = requireSigningSecret(
    localProps.getProperty('librechat.storePassword') ?: System.getenv('LIBRECHAT_STORE_PASSWORD'),
    'librechat.storePassword',
    'LIBRECHAT_STORE_PASSWORD'
)
def signingKeyPassword = requireSigningSecret(
    localProps.getProperty('librechat.keyPassword') ?: System.getenv('LIBRECHAT_KEY_PASSWORD'),
    'librechat.keyPassword',
    'LIBRECHAT_KEY_PASSWORD'
)

android {
    namespace 'com.librechat.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.librechat.app"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file('my-release-key.jks')
            storePassword signingStorePassword
            keyAlias 'my-alias'
            keyPassword signingKeyPassword
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.google.code.gson:gson:2.10.1'
}
